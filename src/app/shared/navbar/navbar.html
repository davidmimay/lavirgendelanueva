<mat-sidenav-container class="sidenav-container">

  <!-- Side menu (mobile) -->
  <mat-sidenav #sidenav mode="over" position="start" class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Inicio
      </a>
      <a mat-list-item routerLink="/museo" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Museo
      </a>
      <a mat-list-item routerLink="/virgen" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Virgen
      </a>
      <a mat-list-item routerLink="/hermandad" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Hermandad
      </a>
      <a mat-list-item routerLink="/velario" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Velario
      </a>
      <a mat-list-item routerLink="/oraciones" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Oraciones
      </a>
      <a mat-list-item routerLink="/romeria" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Romería
      </a>
      <app-theme-toggle />
    </mat-nav-list>
  </mat-sidenav>

  <!-- Content -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="navbar">
      <!-- Button (mobile)-->
      <button mat-icon-button class="menu-button" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="brand" routerLink="/">
        ✝️ Virgen de la Nueva
      </span>

      <span class="spacer"></span>

      <!-- Links (desktop) -->
      <nav class="nav-links">
        <a mat-button routerLink="/" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
        <a mat-button routerLink="/museo" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Museo
        </a>
        <a mat-button routerLink="/virgen" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Virgen
        </a>
        <a mat-button routerLink="/hermandad" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Hermandad
        </a>
        <a mat-button routerLink="/velario" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Velario
        </a>
        <a mat-button routerLink="/oraciones" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Oraciones
        </a>
        <a mat-button routerLink="/romeria" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Romeria
        </a>
      </nav>
      <app-theme-toggle />
    </mat-toolbar>

    <ng-content></ng-content>

  </mat-sidenav-content>

</mat-sidenav-container>
