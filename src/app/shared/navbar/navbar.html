<mat-sidenav-container class="sidenav-container">

  <!-- Menú lateral (móvil) -->
  <mat-sidenav #sidenav mode="over" position="start" class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidenav()">
        Inicio
      </a>
      <!-- Aquí irán más enlaces -->
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="navbar">
      <!-- Botón hamburguesa (solo móvil) -->
      <button mat-icon-button class="menu-button" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="brand" routerLink="/">
        La Virgen de la Nueva
      </span>

      <span class="spacer"></span>

      <!-- Enlaces desktop -->
      <nav class="nav-links">
        <a mat-button routerLink="/" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
        <!-- Aquí irán más enlaces -->
      </nav>
    </mat-toolbar>

    <!-- Aquí se proyectará el resto de la app -->
    <ng-content></ng-content>
  </mat-sidenav-content>

</mat-sidenav-container>
